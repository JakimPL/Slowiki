default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: frontend-format
        name: prettier
        entry: bash -c 'cd frontend && npx prettier --check src tests index.html public'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-lint
        name: eslint + stylelint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-typecheck
        name: tsc
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: vitest
        entry: bash -c 'cd frontend && npm test'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
