[project]
name = "literabble"
version = "0.1.0"
description = "Configurable Literaki and Scrabble word game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "isort>=5.13",
    "mypy>=1.11",
    "pylint>=3.2",
    "pylint-pydantic>=0.3",
    "import-linter>=2.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/wordcore",
    "src/wordserver",
    "src/wordgames",
    "src/wordtable",
    "src/wordassets",
    "src/lexica",
    "src/wordbots",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
