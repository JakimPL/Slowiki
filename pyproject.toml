[project]
name = "literabble"
version = "0.1.0"
description = "Configurable Literaki and Scrabble word game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pyyaml>=6.0"]
morphology = ["morfeusz2==1.99.15", "pyyaml>=6.0"]

[dependency-groups]
dev = [
    "black>=24.10",
    "isort>=5.13",
    "mypy>=1.11",
    "pylint>=3.2",
    "pylint-pydantic>=0.3",
    "import-linter>=2.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/wordcore",
    "src/wordserver",
    "src/wordgames",
    "src/wordtable",
    "src/lexica",
    "src/wordbots",
    "src/wordassets",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = [
    "wordcore",
    "wordgames",
    "wordserver",
    "wordtable",
    "lexica",
    "wordbots",
]
omit = [
    "src/wordtable/cli.py",
    "src/wordtable/play.py",
    "src/wordtable/serve.py",
]

[tool.importlinter]
include_external_packages = true
root_packages = [
    "wordcore",
    "wordgames",
    "wordserver",
    "wordtable",
    "lexica",
    "wordbots",
    "wordassets",
]

[[tool.importlinter.contracts]]
name = "Core knows no subsystem"
type = "forbidden"
source_modules = ["wordcore"]
forbidden_modules = [
    "wordgames",
    "wordserver",
    "wordtable",
    "lexica",
    "wordbots",
    "wordassets",
]

[[tool.importlinter.contracts]]
name = "Rules are transport-free"
type = "forbidden"
source_modules = ["wordcore", "wordgames", "lexica", "wordbots", "wordassets"]
forbidden_modules = ["fastapi", "uvicorn", "httpx"]

[[tool.importlinter.contracts]]
name = "Pure layers know no adapter or host"
type = "forbidden"
source_modules = ["wordgames", "lexica", "wordbots"]
forbidden_modules = ["wordserver", "wordtable"]

[[tool.importlinter.contracts]]
name = "Game, dictionary, and bot layers stay independent"
type = "independence"
modules = ["wordgames", "lexica", "wordbots"]
